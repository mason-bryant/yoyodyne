# Yoyodyne project configuration.
#
# This file is complete. Every value the harness uses is written here, so what
# the file says is what runs and there is nothing to look up somewhere else.
# It was generated from the builtin:v1 template inside the executable, and
# the personas beside it were copied from there at the same time; both are this
# project's to edit now.
#
# That ownership has a price worth knowing up front: a later Yoyodyne that
# improves a persona or corrects a model selector does not reach this project.
# Run "yoyo init" again in a scratch directory and merge what changed if you
# want those improvements.
#
# "yoyo config show --effective --origins" reports the resolved values and
# where each one came from.
#
# This repository is the one that also contains the template, so it has two
# copies of the persona text and they are not the same file. personas/ here is
# what Yoyodyne's own agents read; internal/config/builtin/v1/personas/ is what
# "yoyo init" gives a new project. Change both when the change is meant for
# both.
version: 1

# The humans this project recognizes, one entry each, binding the identifier
# namespaces they are known by. Authority attaches to the human rather than to
# any one namespace: an act is authorized by resolving whichever namespace it
# arrived through -- a commit's address, a push's forge account, a thread
# reply's member id -- to a person, and then asking what that person may do.
# The Slack allow-list is derived from this rather than authored beside it: the
# humans granted direct-work who bound a slack_member_id.
operators:
  mason-bryant:
    git_email: hamneggs@gmail.com
    forge_account: mason-bryant
    slack_member_id: U0BR9M2EKKP # from your profile → "Copy member ID"
    grants:
      - own-intent
      - direct-work

slack:
  enabled: true
  # The faces are the project's own, committed under docs/slack/avatars and
  # served from the repository; versioned filenames because Slack caches
  # icons aggressively. operations-v1.png waits, unmapped, for the post-v1
  # operations role. The harness wears the product's engraved gear, the same
  # image as the Slack app icon (docs/slack/app-icon-v1.png).
  avatars:
    product-manager: https://raw.githubusercontent.com/mason-bryant/yoyodyne/main/docs/slack/avatars/pm-v1.png
    architect: https://raw.githubusercontent.com/mason-bryant/yoyodyne/main/docs/slack/avatars/architect-v1.png
    development-manager: https://raw.githubusercontent.com/mason-bryant/yoyodyne/main/docs/slack/avatars/dev-manager-v1.png
    developer: https://raw.githubusercontent.com/mason-bryant/yoyodyne/main/docs/slack/avatars/developer-v2.png
    reviewer: https://raw.githubusercontent.com/mason-bryant/yoyodyne/main/docs/slack/avatars/verifier-v1.png
    harness: https://raw.githubusercontent.com/mason-bryant/yoyodyne/main/docs/slack/avatars/harness-v1.png
  channel: C0BQY3ZHE8P

product:
  id: yoyodyne
  repository: .
  # The product manager reads product intent from the specifications under this
  # directory and from nowhere else in the repository. Beside them, labeled as a
  # description of what is built rather than as intent, it is given the README,
  # the configuration guide, and the help the commands print -- not this file,
  # not the source, not the design document. It must stay inside the repository.
  specifications: docs/product
  # The architect's durable architectural invariants: one Markdown file per
  # constraint, named by its id. The harness delivers the ones relevant to a
  # work item into the developer's context and the reviewer's evidence. A
  # project with no such directory simply has no invariants yet.
  invariants: docs/decisions/invariants
  # The architect's two artifact homes: designs and specifications, and the
  # decision records the invariants above are extracted from. Every Markdown
  # file in these directories and in the specifications directory carries its
  # identity and metadata in frontmatter -- id, kind, status, what it supports,
  # and a revision log -- so downstream work can refer to one durably. A
  # directory that does not exist simply records no artifacts of that kind yet.
  designs: docs/designs
  decisions: docs/decisions

execution:
  max_concurrent_developers: 3  # raised 2->3 by the operator 2026-09-04 for the wide post-sweep queue; watch the replay rate and usage windows, drop back if either climbs. Was: raised for the ifd.49 soak; the promotion
                                # lease serializes integrations underneath
  repair_attempts_before_replan: 2
  # A promotion that loses a race -- to another run, or to whoever moved the
  # target branch while this one was working -- is replayed onto where the
  # target went and tried again, up to this many times. Every retry re-runs the
  # checks and asks for a fresh independent review, because the change that
  # would now be promoted is not the one that was approved. A replay that
  # conflicts is never resolved automatically: it stops the run and is left for
  # a person.
  integration_retries_before_reconciliation: 2
  # A provider invocation that dies without judging the work -- an API error its
  # own retries did not outlast, or a response cut off mid-flight -- is reissued
  # in the same worktree and the same session, up to this many times, rather than
  # failing the run. Nothing here is a fault in the change, so a relaunch spends
  # no repair attempt. A run that spends this budget stops and records a blocker.
  transient_relaunches_before_blocking: 2
  worktree_root: auto
  # The remote publishing pushes to and opens pull requests against. It is only
  # consulted when approvals.publishing is automatic; a repository with no
  # remote by this name publishes nothing and stays purely local.
  remote: origin
  # A provider usage limit that is exhausted pauses a run rather than failing
  # it. The maximum covers the five-hour limit and deliberately stops short of
  # the seven-day one, so a capacity problem that needs a person reaches one
  # instead of a timer. The in-process bound is how much of that a run spends
  # sleeping here rather than exiting with its deadline recorded. The unknown
  # reset pause is the interval between probes, whether or not the provider
  # named a reset: a quoted reset bounds the wait rather than gating it, because
  # capacity can be bought and windows can roll before the quoted edge.
  usage_limit_max_pause: 6h
  usage_limit_in_process_pause: 6h
  usage_limit_unknown_reset_pause: 30m
  # A provider whose own servers are transiently overloaded refuses without
  # naming any reset at all, so a run waits this much shorter interval and asks
  # again. It spends the same maximum above, so an overload that never lifts
  # reaches that bound rather than reissuing forever.
  server_overload_pause: 90s
  # The total budget each check below gets. This project runs two developers at
  # once, so two suites contend for the same cores and the wall clock of each is
  # what has to fit here -- the ten-minute flat bound this replaced killed a run
  # whose tests were passing package by package under exactly that contention.
  # Two concurrent runs of the heaviest check here ("make race") finish in about
  # eighty seconds on a sixteen-core machine, so this is generous on purpose.
  check_timeout: 30m

# Conservative by default: integration and publishing are opted in to
# separately. Automatic integration is refused unless it is actually gated by
# the checks below and a reviewer agent, and publishing is what pushes a branch
# and opens a pull request where other people can see it.
# The recurring tasks: the development manager's hourly sweep, enabled by the
# operator 2026-09-06 the day its machinery landed (yoyodyne-ifd.283). The
# product manager's coherence scan joins here when its successor item ships.
recurring_tasks:
  development-manager-sweep:
    role: development-manager
    every: 1h
    enabled: true
    max_turns: 4
    prompt: |
      Sweep for unresolved issues: stoppages nobody has decided, claims on work
      nothing is running, deliveries that have stopped moving. Fix what your
      authority allows, batching classes rather than going item by item; ask
      the architect where a ruling is needed; check findings against work
      already admitted before filing; and file root-cause work with the
      product manager for every fix you make. End with a durable report; when
      the system is healthy say NO FINDINGS and stop.

approvals:
  brief: human
  goals: human
  designs: automatic
  # This project has opted in to both. The closed loop gates every promotion --
  # checks, an independent reviewer verdict, and conflict-aware fast-forward
  # integration -- and main is protected against direct pushes, so publishing is
  # how work reaches the remote at all: the developer phase pushes its branch
  # and opens a pull request, and the reviewer's approving verdict merges it.
  integration: automatic
  publishing: automatic
  # Goal-level approval operating as ifd.25 designed: the twelve goals are
  # operator-approved, so admission against them flows directly and the
  # operator is told rather than asked. The harness default of human, plus the
  # broken --message proposal decision (ifd.120), had wedged admission
  # entirely on 2026-08-20.
  work_items: automatic

# Checks are this project's own. Each entry is run through "/bin/sh -c" in the
# run's worktree, so shell syntax works. A check must be non-interactive and
# must exit non-zero on failure -- a run stops at a failing check and never
# reaches review or integration. A run with no checks at all is refused, so
# this list is what makes the file usable rather than merely valid:
#
#   # Go
#   checks:
#     - go test ./...
#     - go vet ./...
#     - gofmt -l . | (! grep .)
#
#   # TypeScript / Node
#   checks:
#     - npm ci
#     - npx tsc --noEmit
#     - npm test -- --run
#     - npx eslint .
#
#   # Python
#   checks:
#     - python -m pytest -q
#     - python -m ruff check .
#     - python -m mypy .
#
#   # Java (Maven)
#   checks:
#     - mvn --batch-mode --quiet verify
#
#   # Java (Gradle)
#   checks:
#     - ./gradlew --no-daemon check
checks:
  - make fmtcheck
  - make test
  - make race
  - make vet

# Every agent is stated in full: nothing about them is inherited. A model
# selector that names a family, such as "opus", floats to that family's current
# default; an exact identifier such as claude-opus-5 pins a version. Persona
# paths are relative to this .yoyodyne directory and must be Markdown inside it.
# Delete an agent to remove it, edit one to change it.
agents:
  architect:
    role: architect
    backend: claude-code
    # The judgment model, per the operator's decision 2026-08-19: the
    # architect's decisions bind everything downstream, which is where
    # judgment pays. Same rule as the product and development managers.
    model: fable
    instances: 1
    persona:
      version: v1
      path: personas/architect.md
  developer:
    role: developer
    backend: claude-code
    model: opus
    # Three instances so max_concurrent_developers: 3 is coherent; the
    # capacity rule refuses a limit the instances cannot supply.
    instances: 3
    persona:
      version: v1
      path: personas/developer.md
  development-manager:
    role: development-manager
    backend: claude-code
    # The judgment model, per the operator's decision when the hierarchy was
    # planned: the decision-owning roles run on Fable. Same reasoning as the
    # product manager below.
    model: fable
    instances: 1
    persona:
      version: v1
      path: personas/development-manager.md
  product-manager:
    role: product-manager
    backend: claude-code
    # The judgment model for the decision-owning role: one bad ordering or
    # decomposition costs more than a session of conversation turns. The
    # family alias floats; run evidence records what the provider served.
    model: fable
    instances: 1
    persona:
      version: v1
      path: personas/product-manager.md
  reviewer:
    role: reviewer
    backend: claude-code
    model: opus
    # Raised 1->2 alongside max_concurrent_developers: 3 so reviews don't
    # queue behind one instance when the slots fill (operator, 2026-09-04).
    instances: 2
    persona:
      version: v1
      path: personas/reviewer.md
