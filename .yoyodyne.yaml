version: 1

product:
  id: yoyodyne
  repository_id: yoyodyne
  repository: .

execution:
  max_concurrent_developers: 1
  repair_attempts_before_replan: 2
  worktree_root: auto

approvals:
  brief: human
  goals: human
  designs: automatic
  # Enabled with the closed loop: checks, an independent reviewer verdict, and
  # conflict-aware fast-forward integration now gate every promotion.
  integration: automatic

checks:
  - make test
  - make race
  - make vet

# Every executable agent declares its own model selector; there is no implicit
# harness default. The "opus" family alias intentionally floats to the backend's
# current default for that family, and run evidence records both the requested
# selector and the model the provider reported serving.
agents:
  developer:
    role: developer
    backend: claude-code
    model: opus
    instances: 1
  reviewer:
    role: reviewer
    backend: claude-code
    model: opus
    instances: 1
