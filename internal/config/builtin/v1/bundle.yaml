# Yoyodyne built-in agent bundle, version 1.
#
# This bundle ships inside the executable and is read-only. It is what
# `yoyo init` generates a project's own complete configuration from, copying
# the personas beside it into the project at the same time. A project may also
# inherit it directly with "extends: builtin:v1" and overlay only the values it
# needs, which is the shape that keeps receiving later changes to this file.
#
# The bundle deliberately omits "product" and "checks": both are properties of
# the project being worked on rather than of the harness, so a project supplies
# them itself. Safety invariants — authority, sandboxing, review verdicts,
# integration, and cleanup — are enforced in Go and are not configurable here.
version: 1

execution:
  max_concurrent_developers: 1
  repair_attempts_before_replan: 2
  # A promotion that loses a race -- to another run, or to whoever moved the
  # target branch while this one was working -- is replayed onto where the
  # target went and tried again, up to this many times. Every retry re-runs the
  # checks and asks for a fresh independent review, because the change that
  # would now be promoted is not the one that was approved. A replay that
  # conflicts is never resolved automatically: it stops the run and is left for
  # a person.
  integration_retries_before_reconciliation: 2
  worktree_root: auto
  # The remote publishing pushes to and opens pull requests against. It is only
  # consulted when approvals.publishing is automatic; a repository with no
  # remote by this name publishes nothing and stays purely local.
  remote: origin
  # A provider usage limit that is exhausted pauses a run rather than failing
  # it. The maximum pause covers the five-hour limit and deliberately stops
  # short of the seven-day one, so a capacity problem that needs a person
  # reaches one instead of a timer. The in-process bound is equal to it, so
  # every wait the harness takes is waited out here and the run continues on its
  # own; lower it to have longer waits exit with the deadline recorded and be
  # resumed by a later invocation instead.
  usage_limit_max_pause: 6h
  usage_limit_in_process_pause: 6h

# Conservative defaults: a project opts in to automatic integration, which the
# harness then refuses unless deterministic checks and a reviewer agent exist.
# Publishing is opted in to separately and for the same reason: pushing a branch
# and opening a pull request is visible outside the machine the harness runs on,
# so a project says so rather than inheriting it.
approvals:
  brief: human
  goals: human
  designs: automatic
  integration: human
  publishing: human

# Every executable agent declares its own model selector; there is no implicit
# harness default. The "opus" family alias intentionally floats to the backend's
# current default for that family, and run evidence records both the requested
# selector and the model the provider reported serving.
agents:
  product-manager:
    role: product-manager
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/product-manager.md
  architect:
    role: architect
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/architect.md
  development-manager:
    role: development-manager
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/development-manager.md
  developer:
    role: developer
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/developer.md
  reviewer:
    role: reviewer
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/reviewer.md
