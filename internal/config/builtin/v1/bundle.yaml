# Yoyodyne built-in agent bundle, version 1.
#
# This bundle ships inside the executable and is read-only. It is what
# `yoyo init` generates a project's own complete configuration from, copying
# the personas beside it into the project at the same time. A project may also
# inherit it directly with "extends: builtin:v1" and overlay only the values it
# needs, which is the shape that keeps receiving later changes to this file.
#
# The bundle deliberately omits "product" and "checks": both are properties of
# the project being worked on rather than of the harness, so a project supplies
# them itself. Safety invariants — authority, sandboxing, review verdicts,
# integration, and cleanup — are enforced in Go and are not configurable here.
version: 1

execution:
  max_concurrent_developers: 1
  repair_attempts_before_replan: 2
  # A promotion that loses a race -- to another run, or to whoever moved the
  # target branch while this one was working -- is replayed onto where the
  # target went and tried again, up to this many times. Every retry re-runs the
  # checks and asks for a fresh independent review, because the change that
  # would now be promoted is not the one that was approved. A replay that
  # conflicts is never resolved automatically: it stops the run and is left for
  # a person.
  integration_retries_before_reconciliation: 2
  # A provider invocation that dies without judging the work -- an API error its
  # own retries did not outlast, or a response cut off mid-flight -- is reissued
  # in the same worktree and the same session, up to this many times, rather than
  # failing the run. Nothing here is a fault in the change, so a relaunch spends
  # no repair attempt. A run that spends this budget stops and records a blocker.
  transient_relaunches_before_blocking: 2
  worktree_root: auto
  # The remote publishing pushes to and opens pull requests against. It is only
  # consulted when approvals.publishing is automatic; a repository with no
  # remote by this name publishes nothing and stays purely local.
  remote: origin
  # A provider usage limit that is exhausted pauses a run rather than failing
  # it. The maximum pause covers the five-hour limit and deliberately stops
  # short of the seven-day one, so a capacity problem that needs a person
  # reaches one instead of a timer. The in-process bound is equal to it, so
  # every wait the harness takes is waited out here and the run continues on its
  # own; lower it to have longer waits exit with the deadline recorded and be
  # resumed by a later invocation instead.
  usage_limit_max_pause: 6h
  usage_limit_in_process_pause: 6h
  # A provider whose own servers are transiently overloaded refuses without
  # naming any reset, so a run waits this short interval and asks again rather
  # than failing. It spends the same maximum pause above, so an overload that
  # never lifts reaches that bound instead of reissuing forever.
  server_overload_pause: 90s
  # The total budget one configured check gets: the whole time it may run, not
  # the time it may stay quiet. It is generous because a check killed at this
  # bound may have been passing the whole time. Raise it as the suite grows, and
  # raise it again for concurrency -- N runs at once multiply the wall clock of
  # every suite without multiplying the cores it runs on.
  check_timeout: 30m
  # "yoyo work --watch" does not return when the queue empties: it waits this
  # long and reads the queue again. Nothing is cached between readings, so this
  # is also how long work admitted or reordered waits to be picked up, and an
  # idle session costs one local tracker read per interval and no provider call.
  work_poll: 60s
  # The failure-storm brake for a session left running unattended: this many runs
  # blocking in a row, with nothing landing between them, holds intake and leaves
  # it held for the operator to lift. It is aimed at a broken machine rather than
  # a broken item -- an item that keeps failing is left alone until something
  # about it changes -- and 0 turns it off entirely.
  blocked_runs_before_intake_hold: 3

# What the operator approves, and what runs without asking.
#
# The brief and the goals are "human" deliberately rather than by omission: they
# are what a person states, they are the whole of what the design asks anybody to
# approve routinely, and everything else traces back to them. Approving one is
# recorded in its frontmatter against the revision it was given for, so an
# approved document, a draft, and one amended since it was approved are three
# distinguishable things. An unapproved document still loads and still governs
# what is downstream of it; the one thing the record decides is what reaches the
# work queue, under work_items below.
#
# Designs are "automatic" for that same reason read the other way: a design
# serving an approved goal is the architect's judgement about how, and approving
# each one is the per-change gate that autonomy is the absence of.
#
# work_items is the one approval that gates rather than records, and it is
# "human" deliberately rather than by omission: every work item is put to the
# operator before it is admitted to the queue. That covers both ways work
# reaches it -- the product manager's direct "create" is refused here as well as
# the automatic admission, because a gate the proposals held while that door
# stood open would be one the product manager could walk around.
#
# Set it to "automatic" to move that approval up to the goals, which is what it
# exists for: work that traces to a goal the operator approved is then admitted
# without a further prompt, and they are told afterwards what went in. Work that
# traces to no goal, work that would cut against one, and a change to the goals
# themselves still stop and ask either way, because those are exactly what the
# product manager escalates rather than proposes.
#
# It is opted in to rather than inherited, for the reason integration and
# publishing are: this is the setting that lets work reach the queue with no
# person in the loop, and autonomy is something a project turns on once it has
# the gates to justify it rather than something a repository acquires by
# extending this bundle. A project that opts in gets a second ramp for free --
# nothing is admitted without asking until goals are actually approved, so it
# still asks about everything until the first "yoyo artifact approve". That is
# also why automatic requires goals to be "human": admitting work rests on the
# goal it serves having been approved, and a project approving no goals has
# nothing for it to rest on.
#
# Integration is conservative: a project opts in to automatic integration, which
# the harness then refuses unless deterministic checks and a reviewer agent
# exist. Publishing is opted in to separately and for the same reason: pushing a
# branch and opening a pull request is visible outside the machine the harness
# runs on, so a project says so rather than inheriting it.
approvals:
  brief: human
  goals: human
  designs: automatic
  work_items: human
  integration: human
  publishing: human

# Every executable agent declares its own model selector; there is no implicit
# harness default. The "opus" family alias intentionally floats to the backend's
# current default for that family, and run evidence records both the requested
# selector and the model the provider reported serving.
agents:
  product-manager:
    role: product-manager
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/product-manager.md
  architect:
    role: architect
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/architect.md
  development-manager:
    role: development-manager
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/development-manager.md
  developer:
    role: developer
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/developer.md
  reviewer:
    role: reviewer
    backend: claude-code
    model: opus
    instances: 1
    persona:
      version: v1
      path: personas/reviewer.md
