<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Product}} — yoyo dashboard</title>
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<header>
  <h1>{{.Product}}</h1>
</header>
<main data-state="unreadable">
  <section class="state state-error" role="alert">
    <h2>The harness's records could not be read</h2>
    <p id="problem">{{.Message}}</p>
    <p class="hint">Nothing is shown over records nothing can read. Reload once the cause is fixed.</p>
  </section>
</main>
</body>
</html>
