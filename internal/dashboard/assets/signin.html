<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Product}} — yoyo dashboard</title>
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<header>
  <h1>{{.Product}}</h1>
</header>
<main data-state="signin">
  <section class="state state-signin">
    <h2>This dashboard needs its token</h2>
    <p>The token was printed once, in the terminal where <code>yoyo dashboard</code> was started. Paste it here; it is kept in a cookie for this browser session and never in a URL.</p>
    {{if .Message}}<p role="alert" class="note">{{.Message}}</p>{{end}}
    <form method="post" action="/session">
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="off" required>
      <button type="submit">Open the dashboard</button>
    </form>
  </section>
</main>
</body>
</html>
