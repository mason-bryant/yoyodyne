<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yoyodyne — yoyo dashboard</title>
    <link rel="stylesheet" href="../../assets/dashboard.css">
  </head>
  <body>
    <p class="render-note">Opened over the busy render, which is not repeated here.</p>
    <div id="grouping" class="popup" role="dialog" aria-modal="true" aria-labelledby="grouping-heading" data-state="empty">
      <div id="grouping-backdrop" class="popup-backdrop"></div>
      <div class="popup-card">
        <div class="popup-head">
          <div>
            <h2 id="grouping-heading" class="popup-title">Needs a human</h2>
            <p id="grouping-note" class="popup-note">what waits on a person, the operator's first, each with its kind and who it is waiting on; each opens its card</p>
          </div>
          <button type="button" id="grouping-close" class="popup-close">Close</button>
        </div>
        <div class="section-empty">
          <p id="grouping-empty" class="empty">Nothing waits on a person.</p>
        </div>
      </div>
    </div>
  </body>
</html>
