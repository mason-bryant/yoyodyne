<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yoyodyne — yoyo dashboard</title>
    <link rel="stylesheet" href="../../assets/dashboard.css">
  </head>
  <body>
    <p class="render-note">What the grouping-loading scenario opened over the page: the page beneath it is the throughput-pending render, and is not repeated here.</p>
    <div id="grouping" class="popup" role="dialog" aria-modal="true" aria-labelledby="grouping-heading" data-state="loading">
      <div id="grouping-backdrop" class="popup-backdrop"></div>
      <div class="popup-card">
        <div class="popup-head">
          <div>
            <h2 id="grouping-heading" class="popup-title">Landed today</h2>
            <p id="grouping-note" class="popup-note"></p>
          </div>
          <button type="button" id="grouping-close" class="popup-close">Close</button>
        </div>
        <div class="section-loading">
          <p class="waiting">
            <span class="pulse" aria-hidden="true"></span>
            Pricing the week…
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
