name: Release

# A release is a tag push and nothing else. Everything the release consists of
# is `make dist`, so rerunning this for a later tag is the whole procedure
# rather than a set of steps somebody has to remember.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check
        run: make check

      - name: Build the release binaries
        run: make dist VERSION="$TAG"

      # A release whose binaries do not name the tag they came from is worse
      # than no release, because every bug report against it is unattributable.
      # The runner can execute one of the three, so that one is executed.
      - name: Verify the binary reports the tag
        run: |
          tar -xzf "dist/yoyo_${TAG}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          reported="$("$RUNNER_TEMP/yoyo" version)"
          if [ "$reported" != "$TAG" ]; then
            echo "yoyo version reported '$reported', expected '$TAG'" >&2
            exit 1
          fi
          echo "yoyo version reports $reported"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .github/release-notes-preamble.md \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
